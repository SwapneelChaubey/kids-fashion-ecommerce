<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <title>Login - Shoppers</title>
    <style>
      .nav-item { position: relative; }
      .typing-brand {
        display: inline-block;
        font-family: monospace;
        white-space: nowrap;
        overflow: hidden;
        width: 0;
        animation: typing 4s steps(8, end) infinite;
      }
      @keyframes typing {
        0%, 100% { width: 0; }
        40%, 60% { width: 100%; }
      }
      @media (min-width: 992px) {
        .nav-item.dropdown:hover .dropdown-menu { display: block; margin-top: 0; }
        .dropdown-toggle::after { transition: transform 0.2s ease-in-out; display: inline-block; }
        .nav-item.dropdown:hover .dropdown-toggle::after { transform: rotate(180deg); }
      }
    </style>
  </head>
  <body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-light px-3" style="background-color: #99babf">
      <div class="container-fluid">
        <a class="navbar-brand text-dark fw-bold fs-4 me-4" href="{% url 'kids' %}">
          <span class="typing-brand">Shoppers</span>
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav me-auto mb-2 mb-lg-0 gap-lg-3">
            <li class="nav-item dropdown">
              <a class="nav-link active dropdown-toggle" href="#" id="navbarDropdown" role="button" data-bs-toggle="dropdown">
                <i class="bi bi-person-circle" style="margin-right: 5px"></i> My Account
              </a>
              <ul class="dropdown-menu" aria-labelledby="navbarDropdown">
                <li><a class="dropdown-item" href="{% url 'profile' %}"><i class="bi bi-person-circle me-2"></i>Profile</a></li>
                <li><a class="dropdown-item" href="{% url 'order' %}"><i class="bi bi-box-seam-fill me-2"></i>Order</a></li>
                <li><hr class="dropdown-divider" /></li>
                <li><a class="dropdown-item" href="{% url 'logout' %}"><i class="bi bi-box-arrow-right me-2"></i>Log out</a></li>
              </ul>
            </li>
            <li class="nav-item dropdown">
              <a class="nav-link active dropdown-toggle" href="#" id="navbarDropdownMore" role="button" data-bs-toggle="dropdown">
                <i class="bi bi-three-dots-vertical"></i> More
              </a>
              <ul class="dropdown-menu" aria-labelledby="navbarDropdownMore">
                <li><a class="dropdown-item" href="{% url 'boys' %}">Boys</a></li>
                <li><a class="dropdown-item" href="{% url 'girls' %}">Girls</a></li>
                <li><hr class="dropdown-divider" /></li>
                <li><a class="dropdown-item" href="{% url 'about' %}">About</a></li>
              </ul>
            </li>
            <li class="nav-item"><a class="nav-link active" href="{% url 'cart' %}"><i class="bi bi-cart me-1"></i>Cart</a></li>
          </ul>
          <form class="d-flex ms-lg-3 my-2 my-lg-0">
            <input class="form-control me-2" type="search" placeholder="Search" style="border-radius: 20px; max-width: 200px" />
            <button class="btn btn-outline-success" type="submit" style="border-radius: 20px">Search</button>
          </form>
        </div>
      </div>
    </nav>

    <!-- Login Container -->
    <div class="container my-5">
      <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-5">
          <div class="card shadow border-0 rounded-3" style="border-top: 5px solid #99babf !important">
            <div class="card-body p-4 p-md-5">
              <div class="text-center mb-4">
                <i class="bi bi-box-arrow-in-right display-4 text-primary mb-2 d-block"></i>
                <h1 class="h3 fw-bold text-dark">Welcome Back</h1>
                <p class="text-muted small">Log in to manage your orders and account</p>
              </div>

              <form action="{% url 'login' %}" method="POST">
                {% csrf_token %}
                <div class="mb-3">
                  <label for="username" class="form-label fw-bold small">Username or Email</label>
                  <input type="text" class="form-control" id="username" name="username" placeholder="Enter username or email" required />
                </div>
                <div class="mb-3">
                  <label for="password" class="form-label fw-bold small">Password</label>
                  <input type="password" class="form-control" id="password" name="password" placeholder="Enter password" required />
                </div>
                <div class="d-flex justify-content-between align-items-center mb-4">
                  <div class="form-check">
                    <input type="checkbox" class="form-check-input" id="rememberMe" />
                    <label class="form-check-label small" for="rememberMe">Remember me</label>
                  </div>
                </div>
                <div class="d-grid">
                  <button type="submit" class="btn btn-primary py-2 fw-bold">Log In</button>
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>

                <!-- <a href="{% url 'login' %}" class="btn btn-primary px-4 py-2 me-sm-2">Log In Again</a> -->
