{% extends 'kids/basic.html' %} 
{% block tittle %}Profile - Shoppers{% endblock%} 
{% block body %}
<!-- Profile Container (Bootstrap Grid & Card) -->
<div class="container my-5">
  <div class="row justify-content-center">
    <div class="col-12 col-md-8 col-lg-6">
      <div
        class="card shadow border-0 rounded-3"
        style="border-top: 5px solid #99babf !important"
      >
        <div class="card-body p-4 p-md-5">
          <div class="text-center mb-4">
            <i
              class="bi bi-person-circle display-4 text-secondary mb-2 d-block"
            ></i>
            <h1 class="h3 fw-bold text-dark">My Profile</h1>
            <p class="text-muted small">
              Manage your personal details and address information
            </p>
          </div>

          <form action="{% url 'profile' %}" method="POST" id="profileForm">
            {% csrf_token %}

            <!-- Full Name -->
            <div class="mb-3 text-start">
              <label for="full_name" class="form-label fw-bold small"
                >Full Name</label
              >
              <input
                type="text"
                class="form-control"
                id="full_name"
                name="full_name"
                value="{{ user.get_full_name|default:'' }}"
                placeholder="Enter full name"
                required
              />
            </div>

            <!-- Email Address -->
            <div class="mb-3 text-start">
              <label for="email" class="form-label fw-bold small"
                >Email Address</label
              >
              <input
                type="email"
                class="form-control"
                id="email"
                name="email"
                value="{{ user.email|default:'' }}"
                placeholder="name@example.com"
                required
              />
            </div>

            <!-- Contact Number -->
            <div class="mb-3 text-start">
              <label for="contact_number" class="form-label fw-bold small"
                >Contact Number</label
              >
              <input
                type="tel"
                class="form-control"
                id="contact_number"
                name="contact_number"
                inputmode="numeric"
                pattern="[0-9]{10}"
                maxlength="10"
                placeholder="1234567890"
                required
              />
            </div>

            <!-- Shipping Address -->
            <div class="mb-4 text-start">
              <label for="address" class="form-label fw-bold small"
                >Shipping Address</label
              >
              <textarea
                class="form-control"
                id="address"
                name="address"
                rows="3"
                placeholder="Enter full street address"
              ></textarea>
            </div>

            <!-- Action Buttons -->
            <div class="d-grid gap-2 d-md-flex justify-content-md-center">
              <button type="submit" class="btn btn-primary px-4 py-2 me-md-2">
                Save Changes
              </button>
              <a
                href="{% url 'order' %}"
                class="btn btn-outline-secondary px-4 py-2"
              >
                View Orders
              </a>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>

{% endblock %}
