{% extends 'kids/basic.html' %}
{% block tittle %}Logout - Shoppers{% endblock %} 
{% block body %}
<!-- Logout Container -->
<div class="container my-5">
  <div class="row justify-content-center">
    <div class="col-12 col-md-8 col-lg-6">
      <div
        class="card shadow border-0 rounded-3 text-center"
        style="border-top: 5px solid #99babf !important"
      >
        <div class="card-body p-4 p-md-5">
          <i
            class="bi bi-check-circle-fill display-4 text-success mb-3 d-block"
          ></i>
          <h1 class="h3 fw-bold text-dark mb-2">You Have Logged Out</h1>
          <p class="text-muted mb-4">
            Thank you for visiting Shoppers. You have been successfully signed
            out of your account.
          </p>

          <div class="d-grid gap-2 d-sm-flex justify-content-sm-center">
            <a
              href="{% url 'kids' %}"
              class="btn btn-outline-secondary px-4 py-2"
              >Return Home</a
            >
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
