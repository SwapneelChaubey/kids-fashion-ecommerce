<div class="container py-4">
{% load static %}
  <!-- Header & Sort -->
  <div class="d-flex justify-content-between align-items-end mb-4 flex-wrap gap-2">
    <div>
      <h2 class="fw-bold mb-1">{{ card_title|default:"" }}</h2>
      <p class="text-muted mb-0">Loved by parents, adored by kids</p>
    </div>
    <div class="d-flex align-items-center gap-2">
      <span class="text-muted small">Sort by:</span>
      <select class="form-select form-select-sm rounded-pill shadow-none" style="width: auto;">
        <option selected>Featured</option>
        <option value="price-asc">Price: Low to High</option>
        <option value="price-desc">Price: High to Low</option>
        <option value="rating">Customer Rating</option>
      </select>
    </div>
  </div>

  <!-- Product Cards Grid -->
  <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-lg-4 g-4">
    
    {% for p in products %}
    <!-- Card 1 -->
    <div class="col">
      <div class="card h-100 rounded-4 border shadow-sm overflow-hidden">
        <div class="position-relative">
        <li>{% if p.image %}
            <img src="{{ p.image.url }}" alt="{{ p.Products_name }}" class="card-img-top object-fit-cover" alt="Playful Dino Print Hoodie" style="height: 220px;">
            {% else %}
                <p>No image uploaded</p>
            {% endif %}
        </li>
        </div>
        <div class="card-body p-3 d-flex flex-column justify-content-between">
          <div>
            <p class="text-muted small mb-1">{{p.des}}</p>
            <h6 class="card-title fw-bold text-dark mb-1">{{p.Products_name}}</h6>
            <!-- <div class="text-warning small mb-2">★★★★★ <span class="text-muted ms-1">(42)</span></div> -->
          </div>
          <div class="d-flex justify-content-between align-items-center pt-2">
            <span class="fw-bold fs-5 text-primary">${{p.price}}</span>
            <button class="btn btn-primary btn-sm rounded-pill px-3 fw-semibold"><i class="bi bi-cart3 me-1"></i>Add</button>
          </div>
        </div>
      </div>
    </div>
{% endfor %}
  </div>
</div>
